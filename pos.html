<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#fbf6f5" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="YosyModa" />
<link rel="manifest" href="manifest-admin.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<title>YosyModa · Caja (Punto de Venta)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#fbf6f5; --surface:#ffffff; --surface-soft:#fdeef1;
  --ink:#3a2d33; --ink2:#4a3b42; --muted:#9a868f; --faint:#c3b2b9;
  --line:#f1e2e6; --line-strong:#ecd3da;
  --rosa:#f4c9d6; --rosa-mid:#e8a9bc; --rosa-deep:#c65f80; --rosa-ink:#a84868;
  --gold:#c6a15b; --gold-soft:#f6edda; --wa:#25D366; --wa-deep:#0e8a54; --wa-soft:#e6f8ee;
  --ok:#2f9e6f; --ok-soft:#e6f6ee; --warn:#c98a3a; --warn-soft:#f8efdd; --danger:#c65a5a; --danger-soft:#f8e8e8;
  --shadow-sm:0 1px 2px rgba(74,59,66,.05);
  --shadow:0 8px 30px -14px rgba(166,72,104,.24), 0 2px 8px -4px rgba(74,59,66,.08);
  --shadow-lg:0 24px 60px -24px rgba(166,72,104,.42);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
.btn,.tab,.chip,.pcard,.iconbtn,.pill,.opt,.stepper button{user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink2);font-family:"Jost",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:84px;overscroll-behavior-y:contain}
.serif{font-family:"Playfair Display",Georgia,serif}
h1,h2,h3,h4{margin:0;line-height:1.2;color:var(--ink)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:15px;color:var(--ink2)}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.hide{display:none!important}
.muted{color:var(--muted)} .small{font-size:13px}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(120% 90% at 100% 0,#fbdbe4 0,rgba(251,219,228,0) 55%),radial-gradient(90% 90% at 0 0,#f7ecd9 0,rgba(247,236,217,0) 50%),var(--bg)}
.login .box{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow-lg);padding:34px 30px;width:min(400px,100%);text-align:center}
.login .logo{font-family:"Playfair Display",serif;font-size:30px;font-weight:700}
.login .logo b{color:var(--rosa-deep)}
.login .tag{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:20px}
.inp{width:100%;padding:12px 14px;border:1.5px solid var(--line-strong);border-radius:12px;background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--rosa-mid);box-shadow:0 0 0 4px var(--surface-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:600;transition:transform .1s,opacity .2s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--rosa-deep);color:#fff;box-shadow:0 10px 22px -12px var(--rosa-deep)}
.btn-ghost{background:var(--surface);border:1.5px solid var(--line-strong)}
.btn-wa{background:var(--wa);color:#fff;box-shadow:0 10px 22px -12px var(--wa)}
.btn-block{width:100%}
.btn-sm{padding:8px 13px;font-size:13.5px;border-radius:10px}
.btn-lg{padding:15px;font-size:16.5px;border-radius:15px}

/* header + tabs */
header.top{position:sticky;top:0;z-index:30;background:rgba(251,246,245,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px;padding:11px 0}
.top .logo{font-family:"Playfair Display",serif;font-size:21px;font-weight:700;margin-right:auto}
.top .logo b{color:var(--rosa-deep)}
.pill{font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px}
.pill.live{background:var(--ok-soft);color:var(--ok)} .pill.demo{background:var(--warn-soft);color:var(--warn)}
.iconbtn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line-strong);background:var(--surface)}
.tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);background:var(--surface)}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 15px;font-weight:500;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap;position:relative}
.tab.active{color:var(--rosa-deep);border-color:var(--rosa-deep);font-weight:600}
.tab .dot{position:absolute;top:8px;right:6px;min-width:17px;height:17px;padding:0 4px;background:var(--rosa-deep);color:#fff;border-radius:999px;font-size:10.5px;font-weight:700;display:grid;place-items:center}
.panel{padding:14px 0}

/* search + chips */
.search2{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-strong);border-radius:11px;padding:10px 13px;box-shadow:var(--shadow-sm)}
.search2 input{border:none;outline:none;background:none;width:100%}
.search2 svg{opacity:.5;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line-strong);font-size:13.5px;font-weight:500;white-space:nowrap;box-shadow:var(--shadow-sm)}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}

/* product grid (vender) */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:10px 0}
@media(max-width:520px){.pgrid{grid-template-columns:1fr 1fr;gap:10px}}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);text-align:left;transition:transform .1s}
.pcard:active{transform:scale(.98)}
.pcard .imgwrap{position:relative;aspect-ratio:1/1;background:var(--surface-soft)}
.pcard .imgwrap img{width:100%;height:100%;object-fit:cover}
.pcard .out{position:absolute;inset:0;background:rgba(255,255,255,.62);display:grid;place-items:center;font-weight:700;color:var(--danger);font-size:13px}
.pcard .code{position:absolute;top:7px;left:7px;font-size:10px;font-weight:700;background:rgba(58,45,51,.75);color:#fff;padding:2px 7px;border-radius:999px;letter-spacing:.03em}
.pcard .b{padding:9px 11px 11px}
.pcard .nm{font-size:14px;font-weight:600;color:var(--ink);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em}
.pcard .rowb{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.pcard .pr{font-family:"Playfair Display",serif;font-weight:700;color:var(--rosa-deep);font-size:16px}
.pcard .st{font-size:11px;color:var(--muted)}
.empty2{text-align:center;padding:44px 20px;color:var(--muted)}
.empty2 .big{font-size:36px;margin-bottom:6px}

/* bottom sheet (variant) */
.scrim{position:fixed;inset:0;background:rgba(58,45,51,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:var(--shadow-lg);transform:translateY(103%);transition:transform .3s cubic-bezier(.22,1,.36,1);max-height:90vh;overflow:auto;max-width:560px;margin:0 auto;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.sheet.show{transform:translateY(0)}
.grab{width:42px;height:5px;border-radius:99px;background:var(--line-strong);margin:10px auto 6px}
.sheet .head{display:flex;gap:13px;padding:6px 20px 4px}
.sheet .head img{width:64px;height:76px;border-radius:11px;object-fit:cover;background:var(--surface-soft);flex:none}
.sheet .head h3{font-size:18px;font-weight:650}
.sheet .head .pr{font-family:"Playfair Display",serif;font-weight:700;color:var(--rosa-deep);font-size:18px;margin-top:3px}
.sheet .body{padding:8px 20px 0}
.pl{font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-width:44px;padding:9px 14px;border-radius:11px;border:1.5px solid var(--line-strong);background:var(--surface);font-size:14px;font-weight:500;transition:all .12s}
.opt.sel{border-color:var(--rosa-deep);background:var(--surface-soft);color:var(--rosa-ink);box-shadow:0 0 0 3px #fbe3ea}
.opt:disabled{opacity:.32;text-decoration:line-through}
.opt.color{display:inline-flex;align-items:center;gap:7px;padding-left:10px}
.opt.color .cd{width:15px;height:15px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.qtyrow{display:flex;align-items:center;gap:15px;margin-top:18px}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line-strong);border-radius:12px;overflow:hidden}
.stepper button{width:44px;height:44px;font-size:21px;color:var(--rosa-deep);display:grid;place-items:center}
.stepper button:disabled{color:var(--faint)}
.stepper .v{min-width:38px;text-align:center;font-weight:700;font-size:17px}
.stnote{font-size:12.5px;color:var(--muted)}

/* ticket bar + drawer */
.ticketbar{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:11px 16px calc(11px + env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--bg) 70%,rgba(251,246,245,0));transform:translateY(130%);transition:transform .28s cubic-bezier(.22,1,.36,1)}
.ticketbar.show{transform:translateY(0)}
.ticketbar .inner{max-width:560px;margin:0 auto;background:var(--ink);color:#fff;border-radius:15px;padding:13px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-lg)}
.ticketbar .n{background:var(--rosa-deep);width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.ticketbar .tt{margin-left:auto;font-family:"Playfair Display",serif;font-weight:700;font-size:19px}
.ticketbar .go{color:var(--rosa);font-weight:600;margin-left:4px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:70;background:var(--bg);box-shadow:var(--shadow-lg);transform:translateX(103%);transition:transform .3s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column}
.drawer.show{transform:translateX(0)}
.drawer .dtop{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.drawer .dtop h3{font-size:19px;font-weight:650}
.drawer .ditems{flex:1;overflow:auto;padding:8px 16px}
.ti{display:flex;gap:11px;padding:12px 0;border-bottom:1px dashed var(--line)}
.ti .th{width:52px;height:62px;border-radius:9px;object-fit:cover;background:var(--surface-soft);flex:none}
.ti .m{flex:1;min-width:0}
.ti .nm{font-size:14px;font-weight:600;color:var(--ink)}
.ti .vr{font-size:12px;color:var(--muted);margin-top:1px}
.ti .pr{font-family:"Playfair Display",serif;color:var(--rosa-deep);font-weight:700;margin-top:3px}
.ti .mini{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;margin-top:6px}
.ti .mini button{width:30px;height:30px;color:var(--rosa-deep);font-size:16px}
.ti .mini .v{min-width:26px;text-align:center;font-size:13.5px;font-weight:700}
.ti .rm{margin-left:auto;color:var(--faint);font-size:12px;align-self:flex-start}
.dfoot{padding:14px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
.descrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.descrow input{width:110px;padding:8px 10px;border:1.5px solid var(--line-strong);border-radius:10px;outline:none;text-align:right}
.totrow{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 10px}
.totrow .t{font-family:"Playfair Display",serif;font-size:25px;font-weight:700;color:var(--ink)}

/* venta ok */
.okview{text-align:center;padding:26px 20px}
.okview .circle{width:74px;height:74px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:38px;margin:0 auto 12px}
.okview .folio{font-family:"Playfair Display",serif;font-size:30px;font-weight:700;color:var(--ink)}

/* rows (pedidos/ventas) */
.list{display:grid;gap:10px;padding:6px 0}
.row{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px;box-shadow:var(--shadow-sm)}
.row .rh{display:flex;align-items:center;gap:10px}
.row .folio{font-weight:700;color:var(--ink)}
.badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
.badge.pend{background:var(--warn-soft);color:var(--warn)} .badge.conf{background:var(--ok-soft);color:var(--ok)}
.badge.desc{background:#eee;color:#888} .badge.anul{background:var(--danger-soft);color:var(--danger)}
.badge.tienda{background:var(--surface-soft);color:var(--rosa-ink)} .badge.online{background:var(--wa-soft);color:var(--wa-deep)}
.row .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.row .money{font-family:"Playfair Display",serif;font-weight:700;color:var(--rosa-deep);font-size:17px;margin-left:auto}
.row .acts{display:flex;gap:8px;margin-top:11px}

/* stats (reporte) */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 4px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow-sm)}
.stat .k{font-size:12px;color:var(--muted);font-weight:500}
.stat .v{font-family:"Playfair Display",serif;font-size:25px;font-weight:700;color:var(--ink);margin-top:2px}
.stat.big{grid-column:1/-1;background:linear-gradient(180deg,#fff,#fdf4f1);border-color:var(--rosa-mid)}
.stat.big .v{color:var(--rosa-deep);font-size:34px}

/* modal + toast */
.modal{position:fixed;z-index:80;left:50%;top:50%;transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;transition:all .24s cubic-bezier(.22,1,.36,1);width:min(560px,94vw);max-height:88vh;overflow:auto;background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg)}
.modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal .mh h3{font-size:18px;font-weight:650}
.modal .mb{padding:16px 18px}
.modal .mf{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);z-index:95;opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-weight:500;box-shadow:var(--shadow-lg);transition:all .25s;font-size:14px;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--danger)} .toast.ok{background:var(--wa-deep)}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.loadfull{min-height:50vh;display:grid;place-items:center;color:var(--muted)}

/* ===================== ÍCONOS ===================== */
.ic{flex:none;display:inline-block;vertical-align:-.18em}
.tab .ic,.btn .ic,.chip .ic,.stat .k .ic{vertical-align:-.2em}
.chip .ic{opacity:.8} .chip.active .ic{opacity:1}
.empty2 .big{color:var(--rosa-mid);line-height:1}
.empty2 .big .ic{stroke-width:1.25;vertical-align:middle}
.okview .circle .ic{stroke-width:2;vertical-align:middle}
.bottomnav button i .ic{vertical-align:middle}

/* ================================================================
   EXPERIENCIA MÓVIL — que se vea y se sienta como una app nativa
   (celular: barra inferior + hojas desde abajo · laptop: pestañas arriba)
   ================================================================ */
html,body{max-width:100%}
body{overflow-x:clip}
.top-in{gap:8px}
.top .logo{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{white-space:nowrap;flex:none}
.top-in .iconbtn,.top-in .btn,.top-in a{flex:none}

/* barra de navegación inferior (solo celular) */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:55;display:none;grid-template-columns:repeat(5,1fr);
  background:#fff;backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -8px 26px -20px rgba(74,59,66,.55)}
.bottomnav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:9px 2px 8px;color:var(--muted);font-size:10.5px;font-weight:600;transition:color .15s}
.bottomnav button i{font-size:20px;font-style:normal;line-height:1;transition:transform .2s cubic-bezier(.2,1.3,.5,1)}
.bottomnav button.active{color:var(--rosa-deep)}
.bottomnav button.active i{transform:translateY(-2px) scale(1.08)}
.bottomnav button:active i{transform:scale(.9)}
.bottomnav .bdot{position:absolute;top:4px;left:calc(50% + 5px);min-width:16px;height:16px;padding:0 4px;
  background:var(--rosa-deep);color:#fff;border-radius:999px;font-size:10px;font-weight:700;
  display:grid;place-items:center;font-style:normal;box-shadow:0 0 0 2px #fff}

@media(max-width:760px){
  .only-desk{display:none!important}
  .tabs{display:none}
  .bottomnav{display:grid}
  body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  .wrap{padding:0 14px}
  .top .logo{font-size:19px}
  .panel{padding:12px 0 2px}
  .ticketbar{bottom:calc(66px + env(safe-area-inset-bottom));padding-bottom:10px}
  /* el aviso aparece arriba: así nunca tapa los botones de cobro ni la barra inferior */
  .toast{top:calc(14px + env(safe-area-inset-top));bottom:auto;transform:translate(-50%,-16px)}
  .toast.show{transform:translate(-50%,0)}
  /* las ventanas salen desde abajo, como en una app del teléfono */
  .modal{left:0;top:auto;bottom:0;width:100%;max-width:100%;max-height:92vh;
    border-radius:24px 24px 0 0;transform:translateY(100%);
    padding-bottom:env(safe-area-inset-bottom)}
  .modal.show{transform:translateY(0)}
  .modal .mf{position:sticky;bottom:0;background:var(--surface)}
}
@media(min-width:761px){ .only-mob{display:none!important} }

/* ===== sensación de app: sin zoom, sin menú de "mantener presionado" ===== */
html{touch-action:pan-x pan-y}
body{-webkit-touch-callout:none}
input,textarea,select,[contenteditable]{-webkit-touch-callout:default;-webkit-user-select:text;user-select:text}
</style>
</head>
<body>
<script src="config.js"></script>

<!-- LOGIN -->
<div class="login" id="loginView">
  <div class="box">
    <div class="logo serif">Yosy<b>Moda</b></div>
    <div class="tag">Caja · Punto de venta</div>
    <p class="muted" style="font-size:14px;margin:0 0 18px">Ingresa tu contraseña para vender.</p>
    <div style="text-align:left"><input class="inp" id="pwd" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn btn-primary btn-block" style="margin-top:14px" onclick="doLogin()">Entrar</button>
    <p class="small muted" id="loginNote" style="margin-top:16px"></p>
  </div>
</div>

<!-- APP -->
<div id="appView" class="hide">
  <header class="top">
    <div class="wrap top-in">
      <span class="logo serif">Yosy<b>Moda</b> <span style="font-size:12px;color:var(--muted);font-family:'Jost'">· Caja</span></span>
      <span class="pill" id="modePill"></span>

  var raw=String(icono==null?"":icono).trim();

function findVar(prod,t,c){return (prod.variantes||[]).find(v=>String(v.talla)===String(t)&&String(v.color||"")===String(c||""));}
function demoCall(action,p){
  const cat=demoCat(); const pos=demoPos();
  const dropStock=(items)=>{ // valida y descuenta; devuelve error o null
    for(const it of items){const prod=cat.products.find(x=>x.id===it.producto_id);const v=prod&&findVar(prod,it.talla,it.color);const have=v?(+v.stock||0):0;if((+it.cantidad||0)>have)return {ok:false,error:"stock",producto:it.nombre,talla:it.talla,color:it.color,disponible:have};}
    items.forEach(it=>{const prod=cat.products.find(x=>x.id===it.producto_id);const v=prod&&findVar(prod,it.talla,it.color);if(v)v.stock=(+v.stock||0)-(+it.cantidad||0);});
    demoCatSave(cat);return null;
  };
  const cliById=id=>(pos.clientes||[]).find(c=>c.id===id);
  const mkVenta=(itemsIn,descuento,canal,pedFolio,pago,clienteId)=>{
    // igual que el backend: el costo SIEMPRE sale del catálogo, no de lo que mandó el navegador
    const items=(itemsIn||[]).map(it=>{const p=cat.products.find(x=>x.id===it.producto_id)||{};
      return Object.assign({},it,{costo:(p.costo!=null?+p.costo:(+it.costo||0)),nombre:p.nombre||it.nombre,
        codigo:p.codigo||it.codigo||"",categoria:p.categoria||it.categoria||""});});
    const sub=items.reduce((s,it)=>s+(+it.precio||0)*(+it.cantidad||0),0);
    const total=Math.max(0,sub-(+descuento||0));
    const folio="V-"+("0000"+(pos.ventas.length+1)).slice(-4);
    const nItems=items.reduce((s,it)=>s+(+it.cantidad||0),0);
    const estado=pago==="credito"?"credito":"pagada";
    const cli=clienteId?cliById(clienteId):null;
    pos.ventas.push({id:"v"+Date.now()+Math.floor(Math.random()*999),folio,fecha:nowStr(),dia:todayStr(),canal:canal||"tienda",pago:pago||"efectivo",subtotal:sub,descuento:+descuento||0,total,items:nItems,estado,pedido_folio:pedFolio||"",cliente:cli?cli.nombre:"",cliente_id:clienteId||"",_items:items});
    if(pago==="credito"&&cli){cli.saldo=(+cli.saldo||0)+total;}
    demoPosSave(pos);return {folio,total,estado};
  };
  if(action==="registrarVenta"){const err=dropStock(p.items);if(err)return err;const r=mkVenta(p.items,p.descuento,"tienda","",p.pago||"efectivo",p.clienteId||"");return {ok:true,folio:r.folio,total:r.total,estado:r.estado};}
  if(action==="crearPedido"){const q=p.pedido||{};const folio="P-"+("0000"+(pos.pedidos.length+1)).slice(-4);pos.pedidos.push({id:"ped"+Date.now(),folio,fecha:nowStr(),dia:todayStr(),cliente:q.cliente||"",whatsapp:q.whatsapp||"",items_json:JSON.stringify(q.items||[]),total:+q.total||0,estado:"pendiente",venta_folio:""});demoPosSave(pos);return {ok:true,folio};}
  if(action==="confirmarPedido"){const ped=pos.pedidos.find(x=>x.id===p.id);if(!ped)return {ok:false,error:"no existe"};if(ped.estado!=="pendiente")return {ok:false,error:"ya procesado"};let items=[];try{items=JSON.parse(ped.items_json||"[]");}catch(e){}const err=dropStock(items);if(err)return err;const r=mkVenta(items,0,"online",ped.folio,p.pago||"efectivo",p.clienteId||"");ped.estado="confirmado";ped.venta_folio=r.folio;demoPosSave(pos);return {ok:true,folio:r.folio};}
  if(action==="descartarPedido"){const ped=pos.pedidos.find(x=>x.id===p.id);if(ped){ped.estado="descartado";demoPosSave(pos);}return {ok:true};}
  if(action==="anularVenta"){const v=pos.ventas.find(x=>x.id===p.id);if(!v)return {ok:false,error:"no existe"};if(v.estado==="anulada")return {ok:true};(v._items||[]).forEach(it=>{const prod=cat.products.find(x=>x.id===it.producto_id);const vr=prod&&findVar(prod,it.talla,it.color);if(vr)vr.stock=(+vr.stock||0)+(+it.cantidad||0);});demoCatSave(cat);if(v.pago==="credito"&&v.cliente_id){const cc=(pos.clientes||[]).find(c=>c.id===v.cliente_id);if(cc)cc.saldo=Math.max(0,(+cc.saldo||0)-(+v.total||0));}v.estado="anulada";demoPosSave(pos);return {ok:true,folio:v.folio};}
  if(action==="getVentas"){return {ok:true,ventas:pos.ventas.slice().reverse()};}
  if(action==="getVentaItems"){const v=pos.ventas.find(x=>x.id===p.id);return {ok:true,items:(v&&v._items)||[]};}
  if(action==="getPedidos"){return {ok:true,pedidos:pos.pedidos.slice().reverse()};}
  if(action==="reporteDia"){const dia=p.dia||todayStr();const vs=pos.ventas.filter(x=>x.dia===dia&&x.estado!=="anulada");let total=0,efectivo=0,fiado=0,ingreso=0,costoTot=0;const canal={};const top={};vs.forEach(x=>{total+=+x.total||0;if(x.pago==="credito")fiado+=+x.total||0;else efectivo+=+x.total||0;canal[x.canal]=(canal[x.canal]||0)+(+x.total||0);(x._items||[]).forEach(it=>{top[it.nombre]=(top[it.nombre]||0)+(+it.cantidad||0);ingreso+=(+it.precio||0)*(+it.cantidad||0);costoTot+=(+it.costo||0)*(+it.cantidad||0);});});const topArr=Object.keys(top).map(k=>({nombre:k,cant:top[k]})).sort((a,b)=>b.cant-a.cant).slice(0,8);let abonos=0;(pos.abonos||[]).forEach(a=>{if((a.fecha||"").slice(0,10)===dia)abonos+=+a.monto||0;});return {ok:true,dia,total,count:vs.length,ticket:vs.length?total/vs.length:0,efectivo,fiado,abonos,ingreso,costo:costoTot,ganancia:ingreso-costoTot,canal,top:topArr};}
  if(action==="getClientes"){return {ok:true,clientes:(pos.clientes||[]).slice()};}
  if(action==="saveCliente"){const c=p.cliente||{};let id=c.id;if(!id){id="cli"+Date.now()+Math.floor(Math.random()*99);pos.clientes.push({id,nombre:c.nombre||"",whatsapp:c.whatsapp||"",saldo:0,notas:c.notas||""});}else{const ex=cliById(id);if(ex){if(c.nombre!=null)ex.nombre=c.nombre;if(c.whatsapp!=null)ex.whatsapp=c.whatsapp;}}demoPosSave(pos);return {ok:true,id};}
  if(action==="registrarAbono"){const cli=cliById(p.clienteId);const m=+p.monto||0;if(m<=0)return {ok:false,error:"monto"};pos.abonos.push({id:"ab"+Date.now(),cliente_id:p.clienteId,venta_folio:p.ventaFolio||"",fecha:nowStr(),monto:m});if(cli)cli.saldo=Math.max(0,(+cli.saldo||0)-m);demoPosSave(pos);return {ok:true,saldo:cli?cli.saldo:0};}
  return {ok:false,error:"demo: acción desconocida"};
}

async function startApp(){
  document.getElementById("loginView").classList.add("hide");
  document.getElementById("appView").classList.remove("hide");
  const pill=document.getElementById("modePill");pill.className="pill "+(LIVE?"live":"demo");pill.textContent=LIVE?"● En vivo":((window.innerWidth<=760)?"● Demo":"● Demostración");

  loadPedidos();
  startPolling();
}
function catSig(cats,prods){
  return (cats||[]).map(c=>c.id+"·"+c.nombre+"·"+(c.orden||0)+"·"+(c.visible!==false)).join("|")
    +"##"+(prods||[]).map(p=>p.id+"·"+p.nombre+"·"+p.precio+"·"+(p.activo!==false)+"·"+(p.imagen||"")+"·"+(p.codigo||"")+"·"+(p.variantes||[]).map(v=>v.talla+"/"+v.color+"/"+v.stock).join(",")).join("|");
}
function applyCatalog(d){
  DATA={config:d.config||{},categories:(d.categories||[]).filter(c=>c.visible!==false).sort((a,b)=>(a.orden||0)-(b.orden||0)),products:(d.products||[]).filter(p=>p.activo!==false)};
  CATMAP={};DATA.categories.forEach(c=>CATMAP[c.id]=c);
  POLLSIG.cat=catSig(DATA.categories,DATA.products);
}
async function loadCatalog(){
  try{const d=await apiGetCatalog();applyCatalog(d);}
  catch(e){toast("No se pudo cargar el catálogo.",true);}
  renderCats();renderGrid();
}
/* Refresco silencioso del catálogo: solo re-dibuja si algo cambió realmente. */
async function loadCatalogSilent(){
  let d;try{d=await apiGetCatalog();}catch(e){return;}
  const cats=(d.categories||[]).filter(c=>c.visible!==false).sort((a,b)=>(a.orden||0)-(b.orden||0));
  const prods=(d.products||[]).filter(p=>p.activo!==false);
  if(catSig(cats,prods)===POLLSIG.cat)return;      // sin cambios → no tocar la pantalla
  applyCatalog(d);
  if(TAB==="vender"){renderCats();renderGrid();}
}
function refreshAll(){POLLSIG={ped:"",cat:"",ven:"",fia:""};loadCatalog();loadPedidos();if(TAB==="ventas")loadVentas();if(TAB==="fiados")loadFiados();if(TAB==="reporte")loadReporte(repDia);toast("Actualizado");}

/* ---------- vender: catálogo ---------- */
function catIcon(id){const c=CATMAP[id]||{};return iconKey(c.icono,c.nombre);}
function stockOf(p){return (p.variantes||[]).reduce((s,v)=>s+(+v.stock||0),0);}
function inTicket(pid,t,c){return ticket.filter(i=>i.producto_id===pid&&i.talla===t&&i.color===c).reduce((s,i)=>s+i.cantidad,0);}
function availOf(prod,t,c){const v=findVar(prod,t,c);return (v?(+v.stock||0):0)-inTicket(prod.id,t,c);}
function imgOf(p){return (p.imagen&&p.imagen.trim())?p.imagen.trim():ph(catIcon(p.categoria));}
function renderCats(){
  let h=`<button class="chip ${filterCat==='all'?'active':''}" onclick="setCat('all')">${ic('sparkle',16)} Todo</button>`;
  DATA.categories.forEach(c=>h+=`<button class="chip ${filterCat===c.id?'active':''}" onclick="setCat('${c.id}')">${ic(iconKey(c.icono,c.nombre),16)} ${c.nombre}</button>`);
  document.getElementById("cats").innerHTML=h;
}
function setCat(id){filterCat=id;renderCats();renderGrid();}
function renderGrid(){
  const q=norm(document.getElementById("psearch").value);
  let list=DATA.products.slice();
  if(filterCat!=="all")list=list.filter(p=>p.categoria===filterCat);
  if(q)list=list.filter(p=>norm(p.nombre).includes(q)||norm(p.codigo).includes(q));
  const g=document.getElementById("grid");
  if(!list.length){g.innerHTML=`<div class="empty2" style="grid-column:1/-1"><div class="big">${ic('search',38)}</div><p>Sin resultados.</p></div>`;return;}
  g.innerHTML=list.map(p=>{const st=stockOf(p);const out=st<=0;
    return `<button class="pcard" onclick="openSheet('${p.id}')" ${out?"disabled style='opacity:.6'":""}>
      <div class="imgwrap"><img src="${imgOf(p)}" onerror="imgErr(this)" alt="">
        ${p.codigo?`<span class="code">${p.codigo}</span>`:""}${out?`<span class="out">Agotado</span>`:""}</div>
      <div class="b"><div class="nm">${p.nombre}</div>
        <div class="rowb"><span class="pr">${money(p.precio)}</span><span class="st">${st} en stock</span></div>
      </div></button>`;
  }).join("");
}

/* ---------- variant sheet ---------- */
let sel={p:null,talla:null,color:null,qty:1};
function openSheet(id){const p=DATA.products.find(x=>x.id===id);if(!p)return;sel={p,talla:null,color:null,qty:1};drawSheet();document.getElementById("scrim").classList.add("show");document.getElementById("sheet").classList.add("show");document.body.style.overflow="hidden";}
function closeSheet(){document.getElementById("scrim").classList.remove("show");document.getElementById("sheet").classList.remove("show");document.body.style.overflow="";}
function tallasOf(p){const t=[];(p.variantes||[]).forEach(v=>{if(!t.includes(v.talla))t.push(v.talla);});return t;}
function coloresOf(p){const c=[];(p.variantes||[]).forEach(v=>{if(v.color&&!c.includes(v.color))c.push(v.color);});return c;}
function tallaOk(p,t){if(sel.color)return availOf(p,t,sel.color)>0;return (p.variantes||[]).some(v=>v.talla===t&&availOf(p,t,v.color)>0);}
function colorOk(p,c){if(sel.talla)return availOf(p,sel.talla,c)>0;return (p.variantes||[]).some(v=>v.color===c&&availOf(p,v.talla,c)>0);}
function drawSheet(){
  const p=sel.p;const tallas=tallasOf(p),colores=coloresOf(p);const needC=colores.length>0;
  const avail=(sel.talla&&(sel.color||!needC))?availOf(p,sel.talla,needC?sel.color:""):0;
  const ready=sel.talla&&(sel.color||!needC)&&avail>0;
  document.getElementById("sheet").innerHTML=`<div class="grab"></div>
   <div class="head"><img src="${imgOf(p)}" onerror="imgErr(this)"><div><h3 class="serif">${p.nombre}</h3>${p.codigo?`<div class="small muted">Código ${p.codigo}</div>`:""}<div class="pr">${money(p.precio)}</div></div></div>
   <div class="body">
     <div class="pl">Talla</div><div class="opts">${tallas.map(t=>`<button class="opt ${sel.talla===t?'sel':''}" ${tallaOk(p,t)?"":"disabled"} onclick="pickT('${encodeURIComponent(t)}')">${t}</button>`).join("")}</div>
     ${needC?`<div class="pl">Color</div><div class="opts">${colores.map(c=>`<button class="opt color ${sel.color===c?'sel':''}" ${colorOk(p,c)?"":"disabled"} onclick="pickC('${encodeURIComponent(c)}')"><span class="cd" style="background:${colorHex(c)}"></span>${c}</button>`).join("")}</div>`:""}
     <div class="qtyrow"><div class="stepper"><button onclick="qStep(-1)" ${sel.qty<=1?"disabled":""}>−</button><span class="v">${sel.qty}</span><button onclick="qStep(1)" ${ready&&sel.qty>=avail?"disabled":""}>+</button></div>
       <span class="stnote">${ready?(avail<=3?`Quedan ${avail}`:"Disponible"):(sel.talla&&(sel.color||!needC)?"Sin stock":"Elige talla"+(needC?" y color":""))}</span></div>
     <button class="btn btn-primary btn-block btn-lg" style="margin-top:18px" ${ready?"":"disabled"} onclick="addToTicket()">Agregar al ticket · ${money(p.precio*sel.qty)}</button>
   </div>`;
}
function pickT(t){t=decodeURIComponent(t);sel.talla=sel.talla===t?null:t;sel.qty=1;drawSheet();}
function pickC(c){c=decodeURIComponent(c);sel.color=sel.color===c?null:c;sel.qty=1;drawSheet();}
function qStep(d){const p=sel.p;const needC=coloresOf(p).length>0;const max=availOf(p,sel.talla,needC?sel.color:"")||1;sel.qty=Math.max(1,Math.min(max,sel.qty+d));drawSheet();}
function addToTicket(){
  const p=sel.p;const needC=coloresOf(p).length>0;const color=needC?sel.color:"";
  if(!sel.talla||(needC&&!sel.color))return;
  const key=p.id+"|"+sel.talla+"|"+color;
  const found=ticket.find(i=>i.producto_id===p.id&&i.talla===sel.talla&&i.color===color);
  if(found)found.cantidad+=sel.qty;
  else ticket.push({producto_id:p.id,codigo:p.codigo||"",nombre:p.nombre,categoria:p.categoria||"",talla:sel.talla,color:color,precio:p.precio,costo:p.costo||0,cantidad:sel.qty,imagen:p.imagen||""});
  closeSheet();renderTicketBar();renderGrid();toast("Agregado al ticket","ok");
}

/* ---------- ticket ---------- */
let descuento=0;
function ticketCount(){return ticket.reduce((s,i)=>s+i.cantidad,0);}
function ticketSub(){return ticket.reduce((s,i)=>s+i.precio*i.cantidad,0);}
function ticketTotal(){return Math.max(0,ticketSub()-descuento);}
function renderTicketBar(){const n=ticketCount();const bar=document.getElementById("ticketbar");bar.classList.toggle("show",n>0&&TAB==="vender");document.getElementById("tbN").textContent=n;document.getElementById("tbT").textContent=money(ticketTotal());}
function openTicket(){renderTicket();document.getElementById("scrim2").classList.add("show");document.getElementById("drawer").classList.add("show");document.body.style.overflow="hidden";}
function closeTicket(){document.getElementById("scrim2").classList.remove("show");document.getElementById("drawer").classList.remove("show");document.body.style.overflow="";}
function tItemMax(i){const prod=DATA.products.find(x=>x.id===i.producto_id);const v=prod&&findVar(prod,i.talla,i.color);return v?(+v.stock||0):i.cantidad;}
function changeTQty(idx,d){const i=ticket[idx];if(!i)return;i.cantidad=Math.max(0,Math.min(tItemMax(i),i.cantidad+d));if(i.cantidad<=0)ticket.splice(idx,1);renderTicket();renderTicketBar();renderGrid();}
function removeT(idx){ticket.splice(idx,1);renderTicket();renderTicketBar();renderGrid();}
function setDesc(v){descuento=Math.max(0,Math.min(ticketSub(),+v||0));renderTicket();renderTicketBar();}
function renderTicket(){
  const items=document.getElementById("ticketItems"),foot=document.getElementById("ticketFoot");
  if(!ticket.length){items.innerHTML=`<div class="empty2"><div class="big">${ic('receipt',38)}</div><p>Ticket vacío. Toca las prendas para agregarlas.</p></div>`;foot.innerHTML="";return;}
  items.innerHTML=ticket.map((i,idx)=>`<div class="ti">
    <img class="th" src="${imgOf({imagen:i.imagen,categoria:i.categoria||''})}" onerror="imgErr(this)">
    <div class="m"><div class="nm">${i.nombre}</div>
      <div class="vr">Talla ${i.talla}${i.color?` · <span style="display:inline-flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;background:${colorHex(i.color)};display:inline-block"></span>${i.color}</span>`:""}</div>
      <div class="pr">${money(i.precio*i.cantidad)}</div>
      <div class="mini"><button onclick="changeTQty(${idx},-1)">−</button><span class="v">${i.cantidad}</span><button onclick="changeTQty(${idx},1)">+</button></div>
    </div><button class="rm" onclick="removeT(${idx})">Quitar</button></div>`).join("");
  foot.innerHTML=`<div class="descrow"><span class="small muted">Descuento (${CUR})</span><input type="number" min="0" inputmode="numeric" value="${descuento||''}" placeholder="0" oninput="setDesc(this.value)"></div>
    <div class="totrow"><span class="muted">Total</span><span class="t serif">${money(ticketTotal())}</span></div>
    <button class="btn btn-primary btn-block btn-lg" id="cobrarBtn" onclick="cobrar()">Cobrar · ${money(ticketTotal())}</button>`;
}
function cobrar(){
  if(!ticket.length)return;
  pagoChooser("Cobrar "+money(ticketTotal()), ()=>finalizeVenta('efectivo','',''), ()=>openClientePicker((id,nom)=>finalizeVenta('credito',id,nom)));
}
/* Selector de pago reutilizable (venta en tienda y confirmación de pedido online). */
function pagoChooser(titulo,onEfectivo,onFiar){
  modal(`<div class="mh"><h3>${titulo}</h3><button class="iconbtn" onclick="closeModal()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
    <div class="mb">
      <p class="small muted" style="margin:0 0 12px">¿Cómo paga la clienta?</p>
      <button class="btn btn-primary btn-block btn-lg" style="margin-bottom:10px" id="pcEfe">${ic('cash',19)} Efectivo</button>
      <button class="btn btn-ghost btn-block btn-lg" id="pcFia">${ic('users',19)} Fiar (crédito)</button>
    </div>`);
  document.getElementById("pcEfe").onclick=function(){onEfectivo&&onEfectivo();};
  document.getElementById("pcFia").onclick=function(){onFiar&&onFiar();};
}
let lastVenta=null;
async function finalizeVenta(pago,clienteId,clienteNombre){
  closeModal();
  const snap=ticket.slice();
  const items=snap.map(i=>({producto_id:i.producto_id,codigo:i.codigo,nombre:i.nombre,talla:i.talla,color:i.color,precio:i.precio,costo:i.costo,cantidad:i.cantidad}));
  const total=ticketTotal(), desc=descuento;
  const res=await apiCall("registrarVenta",{items,descuento:desc,pago,clienteId});
  if(res&&res.ok){
    lastVenta={folio:res.folio||"—",fecha:nowStr(),total:(res.total!=null?res.total:total),descuento:desc,pago,cliente:clienteNombre||"",items:snap};
    ticket=[];descuento=0;renderTicketBar();closeTicket();await loadCatalog();
    showVentaOK(lastVenta);
  } else {
    const msg=(res&&res.error==="stock")?`Sin stock de ${res.producto} (T${res.talla}${res.color?"/"+res.color:""}). Quedan ${res.disponible}.`:("No se pudo cobrar"+(res&&res.error?": "+res.error:""));
    toast(msg,true);
  }
}
function reciboTexto(v){
  const lines=v.items.map(i=>`• ${i.nombre} (T${i.talla}${i.color?"/"+i.color:""}) x${i.cantidad} — ${money(i.precio*i.cantidad)}`).join("\n");
  return `🧾 *${DATA.config.nombre||"YosyModa"}* — Recibo ${v.folio}\n${lines}\n${v.descuento?("Descuento: -"+money(v.descuento)+"\n"):""}*Total: ${money(v.total)}*${v.pago==="credito"?("\n(FIADO"+(v.cliente?" · "+v.cliente:"")+")"):""}\n¡Gracias por tu compra! 💕`;
}
function showVentaOK(v){
  const wa=(DATA.config.whatsapp||CONFIG.WHATSAPP||"");

/* ---------- pedidos ---------- */
function pedSig(peds){return peds.map(p=>p.id+":"+p.estado+":"+(p.venta_folio||"")).join("|");}
function updatePedBadge(peds){const n=peds.filter(p=>p.estado==="pendiente").length;
  ["pedDot","pedDot2"].forEach(function(id){const d=document.getElementById(id);if(d){d.textContent=n;d.classList.toggle("hide",n===0);}});}
function pedCard(p){let items=[];try{items=JSON.parse(p.items_json||"[]");}catch(e){}
  const itemsHtml=items.map(i=>`<div style="display:flex;align-items:center;gap:9px;padding:6px 0">
    <img src="${(i.imagen&&String(i.imagen).trim())?i.imagen:ph(catIcon(i.categoria||''))}" onerror="imgErr(this)" style="width:38px;height:46px;border-radius:7px;object-fit:cover;background:var(--surface-soft);flex:none">
    <div style="flex:1;min-width:0"><div style="font-size:13.5px;font-weight:600;color:var(--ink)">${i.nombre||""} ${i.codigo?`<span class="small" style="color:var(--rosa-ink);font-weight:700">${i.codigo}</span>`:""}</div><div class="small muted">T${i.talla}${i.color?" · "+i.color:""} · x${i.cantidad}</div></div>
    <b class="small">${money((+i.precio||0)*(+i.cantidad||0))}</b></div>`).join("");
  const b=p.estado==="pendiente"?"pend":(p.estado==="confirmado"?"conf":"desc");
  return `<div class="row"><div class="rh"><span class="folio">${p.folio}</span><span class="badge online">online</span><span class="badge ${b}">${p.estado}</span><span class="money">${money(p.total)}</span></div>
    <div class="sub">${p.fecha||""}${p.cliente?" · "+p.cliente:""}</div>
    <div style="margin-top:6px;border-top:1px dashed var(--line)">${itemsHtml||'<div class="sub">—</div>'}</div>
    ${p.estado==="pendiente"?`<div class="acts"><button class="btn btn-primary btn-sm" onclick="confirmarPed('${p.id}')">${ic('check',15)} Confirmar (vender)</button><button class="btn btn-ghost btn-sm" onclick="descartarPed('${p.id}','${p.folio}')">Descartar</button></div>`:(p.venta_folio?`<div class="sub" style="margin-top:6px">Venta ${p.venta_folio}</div>`:"")}</div>`;
}
function renderPedidos(peds){
  updatePedBadge(peds);
  const el=document.getElementById("pedList");if(!el)return;
  if(!peds.length){el.innerHTML=`<div class="empty2"><div class="big">${ic('inbox',38)}</div><p>No hay pedidos todavía.<br><span class="small">Los pedidos de la tienda en línea aparecerán aquí para confirmarlos.</span></p></div>`;return;}
  const pend=peds.filter(p=>p.estado==="pendiente");
  const otros=peds.filter(p=>p.estado!=="pendiente");
  let h="";
  if(pend.length)h+=`<h3 class="serif" style="font-size:16px;margin:4px 0 8px">Pendientes de confirmar (${pend.length})</h3>`+pend.map(pedCard).join("");
  if(otros.length)h+=`<h3 class="serif" style="font-size:16px;margin:18px 0 8px">Recientes</h3>`+otros.map(pedCard).join("");
  el.innerHTML=h;
}
async function loadPedidos(){
  const res=await apiCall("getPedidos",{});const peds=(res&&res.pedidos)||[];
  POLLSIG.ped=pedSig(peds);renderPedidos(peds);
}
/* Refresco silencioso: mantiene el badge al día y re-dibuja la lista SOLO si cambió. */
async function silentPedidos(force){
  const res=await apiCall("getPedidos",{});const peds=(res&&res.pedidos)||[];
  updatePedBadge(peds);
  const sig=pedSig(peds);
  if(force||sig!==POLLSIG.ped){POLLSIG.ped=sig;if(TAB==="pedidos")renderPedidos(peds);}
}
/* Confirmar pedido online: ahora también permite fiarlo (efectivo o crédito). */
function confirmarPed(id){

}

  if(res&&res.ok){toast("Pedido confirmado · Venta "+(res.folio||"")+(pago==="credito"?" · fiado"+(nombre?" a "+nombre:""):"")+"","ok");await loadCatalog();silentPedidos(true);}
  else{const msg=(res&&res.error==="stock")?`No hay stock para ${res.producto} (T${res.talla}${res.color?"/"+res.color:""}). Quedan ${res.disponible}.`:("No se pudo confirmar"+(res&&res.error?": "+res.error:""));toast(msg,true);}

async function loadFiados(){

function verClienta(id){
  const c=CLIENTES.find(x=>x.id===id);if(!c)return;
  const wa=String(c.whatsapp||"").replace(/\D/g,"");
  const recordar=(wa&&c.saldo>0)?("https://wa.me/"+wa+"?text="+encodeURIComponent(`Hola ${c.nombre} 💕, te recordamos tu saldo pendiente con ${DATA.config.nombre||"YosyModa"}: ${money(c.saldo)}. ¡Gracias!`)):"";
  modal(`<div class="mh"><h3>${c.nombre||"Clienta"}</h3><button class="iconbtn" onclick="closeModal()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
   <div class="mb">
     <div class="stat big" style="margin-bottom:12px"><div class="k">Saldo pendiente</div><div class="v">${money(c.saldo)}</div></div>
     ${c.saldo>0?`<label class="small muted">Registrar abono (${CUR})</label>
       <div style="display:flex;gap:8px;margin:6px 0 4px"><input class="inp" id="abonoMonto" type="number" inputmode="numeric" placeholder="0" style="flex:1"><button class="btn btn-primary btn-sm" style="width:auto" onclick="hacerAbono('${c.id}')">Abonar</button></div>`:`<div class="small muted">Sin deuda pendiente.</div>`}
     ${recordar?`<a class="btn btn-wa btn-block btn-sm" href="${recordar}" target="_blank" style="margin-top:12px">Recordar pago por WhatsApp</a>`:""}
     <button class="btn btn-ghost btn-block btn-sm" style="margin-top:8px" onclick='editarClientaModal(${JSON.stringify({id:c.id,nombre:c.nombre,whatsapp:c.whatsapp})})'>Editar datos</button>
   </div>`);
}
async function hacerAbono(id){
  const m=+document.getElementById("abonoMonto").value||0;if(m<=0){toast("Escribe un monto.",true);return;}
  const res=await apiCall("registrarAbono",{clienteId:id,monto:m});
  if(res&&res.ok){toast("Abono registrado","ok");closeModal();await loadFiados();}else toast("No se pudo registrar",true);
}
function editarClientaModal(c){
  c=c||{};
  modal(`<div class="mh"><h3>${c.id?"Editar clienta":"Nueva clienta"}</h3><button class="iconbtn" onclick="closeModal()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
   <div class="mb">
     <label class="small muted">Nombre</label><input class="inp" id="cliNom" value="${(c.nombre||"").replace(/"/g,"&quot;")}" style="margin:4px 0 10px">
     <label class="small muted">WhatsApp (opcional)</label><input class="inp" id="cliWa" value="${c.whatsapp||""}" placeholder="505…" style="margin:4px 0 4px">
   </div>
   <div class="mf"><button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancelar</button><button class="btn btn-primary btn-sm" style="width:auto" onclick="guardarClienta('${c.id||""}')">Guardar</button></div>`);
}
async function guardarClienta(id){
  const nombre=document.getElementById("cliNom").value.trim();if(!nombre){toast("Escribe el nombre.",true);return;}
  const whatsapp=document.getElementById("cliWa").value.replace(/\D/g,"");
  const res=await apiCall("saveCliente",{cliente:{id:id||"",nombre:nombre,whatsapp:whatsapp}});
  if(res&&res.ok){toast("Guardado","ok");closeModal();if(TAB==="fiados")await loadFiados();}else toast("No se pudo guardar",true);
}
let __pickCb=null;
async function openClientePicker(cb){
  __pickCb=cb||((id,nom)=>finalizeVenta("credito",id,nom));
  const res=await apiCall("getClientes",{});const cls=(res&&res.clientes)||[];
  const rows=cls.map(c=>`<button class="row" style="width:100%;text-align:left;margin-bottom:8px;display:block" onclick='pickCliente(${JSON.stringify(c.id)},${JSON.stringify(c.nombre||"")})'><div class="rh"><span class="folio">${c.nombre}</span>${c.saldo>0?`<span class="badge pend" style="margin-left:auto">debe ${money(c.saldo)}</span>`:""}</div></button>`).join("");
  modal(`<div class="mh"><h3>¿A quién se le fía?</h3><button class="iconbtn" onclick="closeModal()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
   <div class="mb">
     <div style="display:flex;gap:8px;margin-bottom:12px"><input class="inp" id="nuevoCli" placeholder="Nombre de clienta nueva" style="flex:1"><button class="btn btn-primary btn-sm" style="width:auto" onclick="fiarANueva()">Crear y fiar</button></div>
     ${cls.length?rows:`<div class="small muted">No hay clientas. Escribe un nombre arriba.</div>`}
   </div>`);
}
function pickCliente(id,nom){const cb=__pickCb||((i,n)=>finalizeVenta("credito",i,n));__pickCb=null;cb(id,nom);}
async function fiarANueva(){
  const nombre=document.getElementById("nuevoCli").value.trim();if(!nombre){toast("Escribe el nombre.",true);return;}
  const res=await apiCall("saveCliente",{cliente:{nombre:nombre}});
  if(res&&res.ok){const cb=__pickCb||((i,n)=>finalizeVenta("credito",i,n));__pickCb=null;cb(res.id,nombre);}else toast("No se pudo crear la clienta",true);
}

/* ---------- ESCÁNER (cámara) ---------- */
let scanner=null;
function openScanner(){
  if(!window.Html5Qrcode){toast("El escáner no cargó (revisa tu internet).",true);return;}
  modal(`<div class="mh"><h3>Escanear código</h3><button class="iconbtn" onclick="closeModal()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
    <div class="mb"><div id="reader" style="width:100%;border-radius:12px;overflow:hidden"></div><p class="small muted" style="text-align:center;margin-top:10px">Apunta a la etiqueta o código de barras de la prenda.</p></div>`);
  try{
    scanner=new Html5Qrcode("reader");
    scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:230,height:150}},onScan,function(){}).catch(function(){toast("No pude abrir la cámara. Da permiso o escribe el código.",true);});
  }catch(e){toast("No se pudo iniciar el escáner.",true);}
}
function onScan(text){
  const code=String(text).trim();closeModal();
  const p=DATA.products.find(x=>norm(x.codigo)===norm(code))||DATA.products.find(x=>x.codigo&&norm(code).indexOf(norm(x.codigo))>=0);
  if(p){openSheet(p.id);toast(p.nombre,"ok");}
  else{document.getElementById("psearch").value=code;renderGrid();toast("Código "+code+" no está registrado.",true);}
}

/* ---------- RECIBO (imagen / PDF) ---------- */
function drawRecibo(v){
  const W=620,pad=34,its=v.items||[];
  const H=176+its.length*46+30+120;
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;const g=cv.getContext("2d");
  g.fillStyle="#ffffff";g.fillRect(0,0,W,H);
  g.fillStyle="#fdeef1";g.fillRect(0,0,W,118);
  g.textAlign="center";g.fillStyle="#c65f80";g.font="700 34px Georgia, serif";g.fillText(DATA.config.nombre||"YosyModa",W/2,52);
  g.fillStyle="#9a7b2e";g.font="600 12px Arial";g.fillText("COMPROBANTE DE VENTA",W/2,76);
  g.fillStyle="#8f7f87";g.font="13px Arial";g.fillText("Recibo "+v.folio+"    ·    "+(v.fecha||""),W/2,98);
  g.strokeStyle="#ecd3da";g.beginPath();g.moveTo(pad,138);g.lineTo(W-pad,138);g.stroke();
  g.textAlign="left";let y=166;
  g.fillStyle="#8f7f87";g.font="600 12px Arial";g.fillText("DESCRIPCIÓN",pad,y);g.textAlign="right";g.fillText("IMPORTE",W-pad,y);g.textAlign="left";
  its.forEach(function(it){y+=44;g.fillStyle="#3a2d33";g.font="600 15px Arial";g.fillText(String(it.nombre||"").slice(0,40),pad,y);
    g.textAlign="right";g.fillText(money(it.precio*it.cantidad),W-pad,y);g.textAlign="left";
    g.fillStyle="#9a868f";g.font="12.5px Arial";g.fillText("Talla "+it.talla+(it.color?" · "+it.color:"")+"    ·    "+it.cantidad+" × "+money(it.precio),pad,y+17);});
  y+=40;g.strokeStyle="#ecd3da";g.beginPath();g.moveTo(pad,y);g.lineTo(W-pad,y);g.stroke();
  y+=32;g.fillStyle="#6d6572";g.font="15px Arial";g.fillText("Total",pad,y);
  g.textAlign="right";g.fillStyle="#c65f80";g.font="700 26px Georgia, serif";g.fillText(money(v.total),W-pad,y+3);g.textAlign="left";
  y+=30;g.fillStyle="#6d6572";g.font="13.5px Arial";g.fillText("Pago: "+(v.pago==="credito"?("Fiado"+(v.cliente?" — "+v.cliente:"")):"Efectivo"),pad,y);
  g.textAlign="center";g.fillStyle="#c65f80";g.font="italic 18px Georgia, serif";g.fillText("¡Gracias por tu compra!",W/2,H-58);
  const wa=(DATA.config.whatsapp||CONFIG.WHATSAPP||"");if(wa){g.fillStyle="#8f7f87";g.font="12.5px Arial";g.fillText("WhatsApp "+wa,W/2,H-34);}
  return cv;
}
function reciboImagen(v){
  v=v||lastVenta;if(!v){toast("No hay recibo.",true);return;}
  lastVenta=v;const cv=drawRecibo(v);window.__recibo=cv;
  const png=cv.toDataURL("image/jpeg",0.92);
  modal(`<div class="mh"><h3>Recibo ${v.folio}</h3><button class="iconbtn" onclick="closeModal()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
    <div class="mb" style="text-align:center">
      <img src="${png}" style="max-width:100%;border:1px solid var(--line);border-radius:12px">
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center">
        <button class="btn btn-primary btn-sm" onclick="descargarRecibo('img')">⬇ Imagen</button>
        <button class="btn btn-ghost btn-sm" onclick="descargarRecibo('pdf')">⬇ PDF</button>
        <button class="btn btn-wa btn-sm" id="shareBtn" onclick="compartirRecibo()">Compartir</button>
      </div>
    </div>`);
  if(!(navigator.canShare)){const b=document.getElementById("shareBtn");if(b)b.style.display="none";}
}
function descargarRecibo(fmt){
  const cv=window.__recibo;if(!cv)return;const f=(lastVenta?lastVenta.folio:"recibo");
  if(fmt==="img"){const a=document.createElement("a");a.href=cv.toDataURL("image/jpeg",0.92);a.download="recibo_"+f+".jpg";a.click();return;}
  try{const JS=window.jspdf&&window.jspdf.jsPDF;const pdf=new JS({unit:"px",format:[cv.width,cv.height]});pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",0,0,cv.width,cv.height);pdf.save("recibo_"+f+".pdf");}
  catch(e){toast("No se pudo el PDF; descargo imagen.",true);const a=document.createElement("a");a.href=cv.toDataURL("image/jpeg",0.92);a.download="recibo_"+f+".jpg";a.click();}
}
async function compartirRecibo(){
  const cv=window.__recibo;if(!cv)return;
  try{const blob=await new Promise(function(r){cv.toBlob(r,"image/jpeg",0.92);});const file=new File([blob],"recibo.jpg",{type:"image/jpeg"});
    if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:"Recibo "+(DATA.config.nombre||"YosyModa")});
    else toast("Tu navegador no permite compartir; usa Descargar.",true);
  }catch(e){}
}

/* ---------- TIEMPO REAL (refresco silencioso, sin parpadeo) ---------- */
function overlayOpen(){return document.querySelector(".scrim.show")!=null;}
let pollTimer=null;
function startPolling(){ if(pollTimer)clearInterval(pollTimer); pollTimer=setInterval(pollTick,10000); }
async function pollTick(){
  if(document.hidden||overlayOpen())return;   // no interrumpir si hay una ventana/panel abierto
  silentPedidos(false);                        // el badge siempre al día; la lista solo si cambió
  if(TAB==="vender")loadCatalogSilent();
  else if(TAB==="ventas")refreshVentasSilent();
  else if(TAB==="fiados")refreshFiadosSilent();
  // El Reporte NO se auto-refresca: podrías estar arqueando (cerrando caja de) una fecha pasada.
}

/* ---------- modal / toast ---------- */
function modal(html){const m=document.getElementById("modal");m.innerHTML=html;document.getElementById("scrim3").classList.add("show");m.classList.add("show");}
function closeModal(){ if(scanner){ try{ scanner.stop().then(function(){try{scanner.clear();}catch(e){}}).catch(function(){}); }catch(e){} scanner=null; } document.getElementById("scrim3").classList.remove("show");document.getElementById("modal").classList.remove("show");}
function confirmModal(title,msg,onOk,okLabel,danger){modal(`<div class="mh"><h3>${title}</h3><button class="iconbtn" onclick="closeModal()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="mb"><p style="margin:0">${msg}</p></div><div class="mf"><button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancelar</button><button class="btn btn-sm" style="width:auto;background:${danger?'var(--danger)':'var(--rosa-deep)'};color:#fff" id="cfB">${okLabel||"Aceptar"}</button></div>`);document.getElementById("cfB").onclick=()=>{closeModal();onOk&&onOk();};}
let toastT;function toast(t,err){const el=document.getElementById("toast");el.textContent=t;el.className="toast show"+(err===true?" err":(err==="ok"?" ok":""));clearTimeout(toastT);toastT=setTimeout(()=>el.className="toast",2600);}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeSheet();closeTicket();closeModal();}});

/* ---------- PWA: instalar como app + service worker ---------- */
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}
let __deferredPrompt=null;
function showInstall(){var b=document.getElementById('installBtn');if(b && !isStandalone())b.style.display='';}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();__deferredPrompt=e;showInstall();});
(function(){ if(/iphone|ipad|ipod/i.test(navigator.userAgent) && !isStandalone()) showInstall(); })();  // iOS no dispara el evento
function instalarApp(){
  if(isStandalone()){toast("La app ya está instalada","ok");return;}
  if(__deferredPrompt){__deferredPrompt.prompt();__deferredPrompt.userChoice.then(function(){__deferredPrompt=null;});return;}
  const iOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  toast(iOS?"En iPhone: toca Compartir y luego 'Agregar a inicio'":"Menú del navegador: 'Instalar app'");
}
window.addEventListener('appinstalled',function(){var b=document.getElementById('installBtn');if(b)b.style.display='none';toast("¡Listo! Ya tienes la Caja como app","ok");});
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }

/* ---------- Se siente app, no navegador: bloquea el pellizco en iPhone ----------
   (el doble-toque y el pellizco en Android los bloquea el CSS touch-action,
    que NO interfiere con los toques rápidos en los botones +/−) */
(function(){
  ['gesturestart','gesturechange','gestureend'].forEach(function(ev){
    document.addEventListener(ev,function(e){ e.preventDefault(); },{passive:false});
  });
})();
</script>
